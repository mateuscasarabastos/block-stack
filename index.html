  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

// Audio Synthesizer
let audioContext = null;
let masterGain = null;

function initAudio() {
  if (!audioContext) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    audioContext = new AudioCtx();
    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.2;
    masterGain.connect(audioContext.destination);
  }
  if (audioContext.state === "suspended") {
    audioContext.resume().catch(() => {});
  }
}

function playTone(freq, duration, type = "sine", vol = 0.1, delay = 0) {
  if (!audioContext || !masterGain) return;
  const now = audioContext.currentTime + delay;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.001), now + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(now);
  osc.stop(now + duration + 0.02);
}

function playPlaceSound() {
  playTone(520, 0.08, "triangle", 0.12);
  playTone(780, 0.10, "triangle", 0.08, 0.045);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

function createCakeSliceParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: x + Math.random() * 20 - 10,
      y: y,
      vx: (Math.random() - 0.5) * 160,
      vy: -Math.random() * 120 - 40,
      color: color,
      size: Math.random() * 6 + 3,
      alpha: 1,
      life: 1
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 380 * dt;
    p.life -= dt * 1.5;
    p.alpha = Math.max(0, p.life);
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + cameraY, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function formatCoins(val) {
  return Number.isInteger(val) ? String(val) : val.toFixed(1);
}

  messageElement.textContent = text;

  hardButton.classList.toggle("selected", name === "hard");
  impossibleButton.classList.toggle("selected", name === "impossible");

  updateRecordDisplay();
}

function renderSkinsModal() {

      <div>
        ${
          isActive
            ? `<span class="px-3 py-1.5 bg-amber-500 text-slate-950 font-black text-xs rounded-xl uppercase">Em Uso</span>`
            : isUnlocked
            ? `<button onclick="equipSkin('${skin.id}')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs rounded-xl transition">Equipar</button>`
            : `<button onclick="buySkin('${skin.id}', ${skin.price})" class="px-3 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-xs rounded-xl shadow-md transition flex items-center gap-1">
                <span>🪙</span> ${skin.price}
              </button>`
        }
      </div>
    `;
    skinsList.appendChild(item);
  });
}

function equipSkin(id) {
  activeSkinId = id;
  localStorage.setItem("blockStackActiveSkin", id);
  renderSkinsModal();
  playUIClickSound();
  // Atualiza o badge imediatamente se estiver em jogo
  if (started) updateStageBadge(score);
}

function buySkin(id, price) {
  if (coins >= price) {
    coins -= price;
    localStorage.setItem("blockStackCoins", String(coins));
    unlockedSkins.push(id);
    localStorage.setItem("blockStackUnlockedSkins", JSON.stringify(unlockedSkins));
    activeSkinId = id;
    localStorage.setItem("blockStackActiveSkin", id);
    coinsElement.textContent = formatCoins(coins);
    renderSkinsModal();
    playGoldenSuccessSound();
    if (started) updateStageBadge(score);
  } else {
    playGoldenLostSound();
  }
}

function returnToStartScreen() {
  started = false;
  gameOver = false;
  paused = false;
  currentBlock = null;
  currentIsGolden = false;
  goldenPending = false;
  blocks = [];
  particles = [];
  score = 0;
  cameraY = 0;
  cameraTargetY = 0;
  moveSpeed = INITIAL_MOVE_SPEED;

  scoreElement.textContent = "0";
  coinsElement.textContent = formatCoins(coins);
  messageElement.textContent = "Toque na tela para colocar a camada de bolo";
  pauseButton.style.display = "none";
  resetButton.style.display = "none";
  updatePauseButton();
  startScreen.style.display = "flex";
  skinsButton.style.display = "block";
  gameOverScreen.style.display = "none";
}

function startGame() {
  initAudio();
  started = true;
  startScreen.style.display = "none";
  skinsButton.style.display = "none";
  gameOverScreen.style.display = "none";
  pauseButton.style.display = "flex";
  resetButton.style.display = "flex";

  score = 0;
  gameOver = false;
  paused = false;
  goldenPending = false;
  particles = [];

  if (messageTimer) { clearTimeout(messageTimer); messageTimer = null; }

  blocks = [];
  cameraY = 0;
  cameraTargetY = 0;
  moveSpeed = INITIAL_MOVE_SPEED * difficultyMultiplier;

  const baseX = (width - INITIAL_WIDTH) / 2;
  const baseWorldY = height - 80;

  blocks.push({
    x: baseX,
    worldY: baseWorldY,
    width: INITIAL_WIDTH,
    height: BLOCK_HEIGHT,
    colorIndex: 0,
    decorType: 0
  });

  createNextBlock();

  scoreElement.textContent = score;
  coinsElement.textContent = formatCoins(coins);
  messageElement.textContent = "Toque na tela para colocar a camada de bolo";
  updateStageBadge(score);
  updatePauseButton();
}

function createNextBlock() {
  const previous = blocks[blocks.length - 1];
  const isGolden = goldenPending;
  goldenPending = false;
  currentIsGolden = isGolden;

  const nextWidth = isGolden ? Math.min(width, previous.width * 2) : previous.width;
  const direction = Math.random() < 0.5 ? 1 : -1;

  if (isGolden) {
    if (messageTimer) { clearTimeout(messageTimer); messageTimer = null; }
    messageElement.textContent = "Bolo Dourado de Recompensa!";
    playGoldenAppearSound();
  }

  const currentSkin = SKINS.find(s => s.id === activeSkinId) || SKINS[0];
  const colorIdx = Math.floor(Math.random() * currentSkin.palette.length);

  currentBlock = {
    x: direction === 1 ? 0 : width - nextWidth,
    worldY: previous.worldY - BLOCK_HEIGHT,
    width: nextWidth,
    height: BLOCK_HEIGHT,
    direction,
    golden: isGolden,
    wallBonus: 0,
    speed: isGolden ? moveSpeed * 1.5 : moveSpeed,
    colorIndex: colorIdx,
    decorType: Math.floor(Math.random() * 4)
  };
}

function updateCamera() {
  if (!currentBlock) return;
  const triggerY = height * CAMERA_TRIGGER;
  const screenY = currentBlock.worldY + cameraY;

  if (screenY < triggerY) {
    cameraTargetY = triggerY - currentBlock.worldY;
  }
  cameraY += (cameraTargetY - cameraY) * 0.10;
}

function update(dt) {
  if (!started || gameOver || paused || !currentBlock) return;

  cowX += cowSpeed * dt;
  if (cowX > width + 100) cowX = -100;

  if (currentIsGolden) {
    currentBlock.speed = moveSpeed * 1.5;
    currentBlock.x += currentBlock.direction * currentBlock.speed * dt;
  } else {
    currentBlock.speed = moveSpeed * (1 + currentBlock.wallBonus);
    currentBlock.x += currentBlock.direction * currentBlock.speed * dt;

    if (currentBlock.x + currentBlock.width >= width) {
      currentBlock.x = width - currentBlock.width;
      currentBlock.direction = -1;
      currentBlock.wallBonus = Math.min(MAX_WALL_BONUS, currentBlock.wallBonus + WALL_BOUNCE_INCREMENT);
      playWallBounceSound();
    }

    if (currentBlock.x <= 0) {
      currentBlock.x = 0;
      currentBlock.direction = 1;
      currentBlock.wallBonus = Math.min(MAX_WALL_BONUS, currentBlock.wallBonus + WALL_BOUNCE_INCREMENT);
      playWallBounceSound();
    }
  }

  updateParticles(dt);
  updateCamera();
}

function placeBlock() {
  if (!started || gameOver || paused || !currentBlock) return;

  const previous = blocks[blocks.length - 1];
  const current = currentBlock;

  if (currentIsGolden) {
    const previousLeft = previous.x;
    const previousRight = previous.x + previous.width;
    const currentLeft = current.x;
    const currentRight = current.x + current.width;

    const overlapWidth = Math.min(previousRight, currentRight) - Math.max(previousLeft, currentLeft);

    if (overlapWidth <= 0) {
      currentBlock = null;
      currentIsGolden = false;
      playGoldenLostSound();
      showTemporaryMessage("Bolo dourado perdido!");
      createNextBlock();
      updateCamera();
      return;
    }

    blocks.push({
      x: (width - current.width) / 2,
      worldY: current.worldY,
      width: current.width,
      height: BLOCK_HEIGHT,
      golden: true,
      colorIndex: current.colorIndex,
      decorType: current.decorType
    });

    coins += 3 * difficultyMultiplier;
    localStorage.setItem("blockStackCoins", String(coins));
    coinsElement.textContent = formatCoins(coins);

    currentBlock = null;
    currentIsGolden = false;
    playGoldenSuccessSound();
    showTemporaryMessage("Bolo Dourado colocado! Base expandida!");
    createNextBlock();
    updateCamera();
    return;
  }

  const previousLeft = previous.x;
  const previousRight = previous.x + previous.width;
  const currentLeft = current.x;
  const currentRight = current.x + current.width;

  const overlapLeft = Math.max(previousLeft, currentLeft);
  const overlapRight = Math.min(previousRight, currentRight);
  const overlapWidth = overlapRight - overlapLeft;

  if (overlapWidth <= 0) {
    playGameOverSound();
    gameOver = true;
    paused = false;
    messageElement.textContent = "A torre de bolos caiu!";
    finalScoreElement.textContent = score;
    pauseButton.style.display = "none";
    resetButton.style.display = "none";
    gameOverScreen.style.display = "flex";
    return;
  }

  if (currentLeft < previousLeft) {
    createCakeSliceParticles(currentLeft, current.worldY, "#f43f5e");
  }
  if (currentRight > previousRight) {
    createCakeSliceParticles(overlapRight, current.worldY, "#f43f5e");
  }

  const newBlock = {
    x: overlapLeft,
    worldY: current.worldY,
    width: overlapWidth,
    height: BLOCK_HEIGHT,
    colorIndex: current.colorIndex,
    decorType: current.decorType
  };

  blocks.push(newBlock);
  playPlaceSound();

  score++;
  updateStageBadge(score);

  const currentRecord = Number(records[selectedDifficulty] || 0);
  if (score > currentRecord) {
    records[selectedDifficulty] = score;
    localStorage.setItem("blockStackRecords", JSON.stringify(records));
    updateRecordDisplay();
  }

  coins += difficultyMultiplier;
  localStorage.setItem("blockStackCoins", String(coins));
  scoreElement.textContent = score;
  coinsElement.textContent = formatCoins(coins);

  if (score % SPEED_INCREASE_EVERY === 0) {
    moveSpeed *= (1 + SPEED_INCREASE_AMOUNT);
    goldenPending = true;
  }

  createNextBlock();
}

function drawBackground() {
  ctx.save();

  const isCyber = activeSkinId === "cyberpunk";

  // ========== CYBERPUNK BACKGROUNDS ==========
  if (isCyber) {
    // STAGE 1: Neon Alley (0-24)
    if (score < 25) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#0a0a12");
      grad.addColorStop(0.5, "#0f0a1a");
      grad.addColorStop(1, "#1a0a18");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Vertical neon signs / rain lines
      for (let i = 0; i < 18; i++) {
        const x = (i * 73 + 20) % width;
        ctx.strokeStyle = i % 3 === 0 ? "#22d3ee33" : (i % 3 === 1 ? "#f472b633" : "#a855f733");
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + (i % 5 - 2), height);
        ctx.stroke();
      }

      // Horizontal neon glow bars
      ctx.fillStyle = "#22d3ee15";
      ctx.fillRect(0, height * 0.3, width, 3);
      ctx.fillStyle = "#ec489915";
      ctx.fillRect(0, height * 0.55, width, 2);
      ctx.fillStyle = "#a855f715";
      ctx.fillRect(0, height * 0.75, width, 4);
    }
    // STAGE 2: Cyber District (25-49)
    else if (score < 50) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#050510");
      grad.addColorStop(0.6, "#0c0a1f");
      grad.addColorStop(1, "#1a0a2e");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // City skyline silhouettes
      ctx.fillStyle = "#0a0a18";
      for (let i = 0; i < 12; i++) {
        const bx = (i * 90) % (width + 40) - 20;
        const bh = 80 + (i % 5) * 40;
        ctx.fillRect(bx, height - bh - 40, 50 + (i % 3) * 20, bh);
      }

      // Neon windows
      ctx.fillStyle = "#22d3ee88";
      for (let i = 0; i < 30; i++) {
        const wx = (i * 47 + 15) % width;
        const wy = height - 60 - ((i * 31) % 180);
        ctx.fillRect(wx, wy, 4, 6);
      }

      // Flying neon orbs
      ctx.fillStyle = "#f472b6aa";
      ctx.beginPath();
      ctx.arc(width * 0.2, 120, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#22d3eeaa";
      ctx.beginPath();
      ctx.arc(width * 0.75, 90, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    // STAGE 3: Holo Sky (50-74)
    else if (score < 75) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#020008");
      grad.addColorStop(0.4, "#0a0520");
      grad.addColorStop(1, "#120a2a");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Holographic grid
      ctx.strokeStyle = "#22d3ee22";
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Big holographic moon / orb
      const hx = width - 90;
      const hy = 100;
      const holoGrad = ctx.createRadialGradient(hx, hy, 10, hx, hy, 55);
      holoGrad.addColorStop(0, "#22d3ee");
      holoGrad.addColorStop(0.5, "#a855f788");
      holoGrad.addColorStop(1, "transparent");
      ctx.fillStyle = holoGrad;
      ctx.beginPath();
      ctx.arc(hx, hy, 55, 0, Math.PI * 2);
      ctx.fill();
    }
    // STAGE 4: Cyberspace (75-99)
    else if (score < 100) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#000005");
      grad.addColorStop(0.5, "#050018");
      grad.addColorStop(1, "#0a0020");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Digital stars / data points
      for (let i = 0; i < 60; i++) {
        const sx = (i * 97) % width;
        const sy = (i * 53) % height;
        ctx.fillStyle = i % 4 === 0 ? "#22d3ee" : (i % 4 === 1 ? "#f472b6" : "#a855f7");
        ctx.fillRect(sx, sy, (i % 3) + 1, (i % 3) + 1);
      }

      // Matrix-like vertical streams
      ctx.fillStyle = "#22d3ee18";
      for (let i = 0; i < 10; i++) {
        const mx = (i * 110 + 30) % width;
        ctx.fillRect(mx, 0, 2, height);
      }
    }
    // STAGE 5: Data Singularity (100+)
    else {
      ctx.fillStyle = "#000003";
      ctx.fillRect(0, 0, width, height);

      const bhX = width / 2;
      const bhY = 180;

      // Digital accretion disk
      const diskGrad = ctx.createRadialGradient(bhX, bhY, 15, bhX, bhY, 150);
      diskGrad.addColorStop(0, "#000");
      diskGrad.addColorStop(0.2, "#22d3ee");
      diskGrad.addColorStop(0.45, "#ec4899");
      diskGrad.addColorStop(0.7, "#a855f7");
      diskGrad.addColorStop(1, "transparent");
      ctx.fillStyle = diskGrad;
      ctx.beginPath();
      ctx.arc(bhX, bhY, 150, 0, Math.PI * 2);
      ctx.fill();

      // Event horizon
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(bhX, bhY, 42, 0, Math.PI * 2);
      ctx.fill();

      // Orbiting digital cow (or glitch)
      ctx.font = "36px sans-serif";
      ctx.fillText("🐮", cowX, bhY + Math.sin(cowX * 0.02) * 28);
      ctx.fillStyle = "#22d3ee";
      ctx.font = "12px monospace";
      ctx.fillText("ERROR_404", cowX - 10, bhY + Math.sin(cowX * 0.02) * 28 + 22);
    }

    // Cyber ground plate
    const groundWorldY = height - 42;
    const groundScreenY = groundWorldY + cameraY;
    if (groundScreenY < height) {
      ctx.fillStyle = "#0a0a14";
      ctx.fillRect(0, groundScreenY, width, height - groundScreenY);
      // Neon ground line
      ctx.fillStyle = "#22d3ee";
      ctx.shadowColor = "#22d3ee";
      ctx.shadowBlur = 10;
      ctx.fillRect(0, groundScreenY, width, 3);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ec4899";
      ctx.fillRect(0, groundScreenY + 4, width, 1);
    }
  }

  // ========== NORMAL BACKGROUNDS (outras skins) ==========
  else {
    if (score < 25) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#1a0f0a");
      grad.addColorStop(1, "#361c12");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#f59e0b22";
      for (let i = 0; i < 6; i++) {
        const cx = (i * 130 + 40) % width;
        const cy = (i * 90 + 100) % height;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 15, cy - 35);
        ctx.lineTo(cx + 30, cy);
        ctx.fill();
      }
    } else if (score < 50) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#38bdf8");
      grad.addColorStop(0.7, "#bae6fd");
      grad.addColorStop(1, "#86efac");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#ffffffaa";
      ctx.beginPath();
      ctx.arc(80, 120, 40, 0, Math.PI * 2);
      ctx.arc(120, 110, 50, 0, Math.PI * 2);
      ctx.arc(160, 120, 40, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(width - 100, 200, 35, 0, Math.PI * 2);
      ctx.arc(width - 60, 190, 45, 0, Math.PI * 2);
      ctx.fill();
    } else if (score < 75) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#090d16");
      grad.addColorStop(0.6, "#0f172a");
      grad.addColorStop(1, "#1e1b4b");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(width - 80, 90, 35, 0, Math.PI * 2);
      ctx.fill();
    } else if (score < 100) {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#030014");
      grad.addColorStop(0.5, "#0d0029");
      grad.addColorStop(1, "#190038");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97) % width;
        const sy = (i * 53) % height;
        ctx.fillRect(sx, sy, (i % 3) + 1, (i % 3) + 1);
      }
    } else {
      ctx.fillStyle = "#020005";
      ctx.fillRect(0, 0, width, height);

      const bhX = width / 2;
      const bhY = 180;

      const grad = ctx.createRadialGradient(bhX, bhY, 20, bhX, bhY, 140);
      grad.addColorStop(0, "#000");
      grad.addColorStop(0.25, "#ec4899");
      grad.addColorStop(0.6, "#8b5cf6");
      grad.addColorStop(1, "transparent");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bhX, bhY, 140, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(bhX, bhY, 45, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = "38px sans-serif";
      ctx.fillText("🐮", cowX, bhY + Math.sin(cowX * 0.02) * 30);
    }

    // Normal ground plate
    const groundWorldY = height - 42;
    const groundScreenY = groundWorldY + cameraY;
    if (groundScreenY < height) {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, groundScreenY, width, height - groundScreenY);
      ctx.fillStyle = "#10b981";
      ctx.fillRect(0, groundScreenY, width, 8);
    }
  }

  ctx.restore();
}

// Render individual detailed cake blocks
function drawCakeBlock(block, index) {
  const screenY = block.worldY + cameraY;
  if (screenY + block.height < -60 || screenY > height + 60) return;

  const currentSkin = SKINS.find(s => s.id === activeSkinId) || SKINS[0];
  const palette = currentSkin.palette[block.colorIndex % currentSkin.palette.length];
  const skinId = currentSkin.id;

  ctx.save();

  if (block.golden || (block === currentBlock && currentIsGolden)) {
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(block.x, screenY, block.width, block.height);
    ctx.fillStyle = "#fef08a";
    ctx.fillRect(block.x, screenY, block.width, 10);
    ctx.strokeStyle = "#b45309";
    ctx.lineWidth = 3;
    ctx.strokeRect(block.x, screenY, block.width, block.height);
    ctx.fillStyle = "#fff";
    ctx.font = "14px sans-serif";
    ctx.fillText("✨", block.x + block.width / 2 - 7, screenY + 24);
    ctx.restore();
    return;
  }

  if (skinId === "classic") {
    ctx.fillStyle = palette.body;
    ctx.fillRect(block.x, screenY, block.width, block.height);
    ctx.fillStyle = palette.frosting;
    ctx.fillRect(block.x, screenY, block.width, 10);
    const dripCount = Math.floor(block.width / 20);
    for (let i = 0; i < dripCount; i++) {
      ctx.beginPath();
      ctx.arc(block.x + i * 20 + 10, screenY + 10, 5, 0, Math.PI);
      ctx.fill();
    }
    ctx.strokeStyle = palette.accent;
    ctx.lineWidth = 2;
    ctx.strokeRect(block.x, screenY, block.width, block.height);

    if (block.decorType === 0) {
      ctx.fillStyle = "#ef4444";
      for (let cx = block.x + 15; cx < block.x + block.width - 10; cx += 35) {
        ctx.beginPath();
        ctx.arc(cx, screenY - 2, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (block.decorType === 1) {
      const colors = ["#f43f5e", "#3b82f6", "#eab308", "#10b981"];
      for (let s = 0; s < block.width / 15; s++) {
        ctx.fillStyle = colors[s % colors.length];
        ctx.fillRect(block.x + s * 15 + 6, screenY + 16, 6, 3);
      }
    } else if (block.decorType === 2) {
      ctx.fillStyle = "#ffffff";
      for (let wx = block.x + 20; wx < block.x + block.width - 15; wx += 40) {
        ctx.beginPath();
        ctx.arc(wx, screenY + 2, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  else if (skinId === "cyberpunk") {
    ctx.fillStyle = palette.body;
    ctx.fillRect(block.x, screenY, block.width, block.height);

    ctx.fillStyle = palette.frosting;
    ctx.shadowColor = palette.frosting;
    ctx.shadowBlur = 12;
    ctx.fillRect(block.x, screenY, block.width, 8);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = palette.accent;
    ctx.lineWidth = 2;
    ctx.shadowColor = palette.accent;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(block.x + 2, screenY + 4);
    ctx.lineTo(block.x + 2, screenY + block.height - 4);
    ctx.moveTo(block.x + block.width - 2, screenY + 4);
    ctx.lineTo(block.x + block.width - 2, screenY + block.height - 4);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = palette.top;
    for (let i = 0; i < Math.floor(block.width / 28); i++) {
      const nx = block.x + 14 + i * 28;
      ctx.beginPath();
      ctx.arc(nx, screenY + 20, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = palette.frosting;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(block.x, screenY, block.width, block.height);
  }
  else if (skinId === "pixel") {
    ctx.fillStyle = palette.body;
    ctx.fillRect(block.x, screenY, block.width, block.height);
    ctx.fillStyle = palette.frosting;
    ctx.fillRect(block.x, screenY, block.width, 12);
    ctx.strokeStyle = palette.accent;
    ctx.lineWidth = 3;
    ctx.strokeRect(block.x + 1, screenY + 1, block.width - 2, block.height - 2);

    ctx.fillStyle = palette.top;
    for (let i = 0; i < Math.floor(block.width / 16); i++) {
      const pxPos = block.x + 8 + i * 16;
      ctx.fillRect(pxPos, screenY + 18, 8, 8);
    }
    ctx.fillStyle = "#ffffff88";
    ctx.fillRect(block.x + 4, screenY + 4, 6, 4);
  }
  else if (skinId === "donuts") {
    ctx.fillStyle = palette.body;
    ctx.beginPath();
    ctx.roundRect(block.x, screenY, block.width, block.height, 10);
    ctx.fill();

    ctx.fillStyle = palette.frosting;
    ctx.beginPath();
    ctx.roundRect(block.x + 2, screenY, block.width - 4, 14, [10, 10, 0, 0]);
    ctx.fill();

    const sprinkleColors = ["#ef4444", "#3b82f6", "#eab308", "#10b981", "#ec4899", "#8b5cf6"];
    for (let i = 0; i < Math.floor(block.width / 12); i++) {
      ctx.fillStyle = sprinkleColors[i % sprinkleColors.length];
      const sx = block.x + 8 + i * 12;
      const sy = screenY + 6 + (i % 3) * 3;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate((i % 2 === 0 ? 1 : -1) * 0.4);
      ctx.fillRect(-3, -1.5, 6, 3);
      ctx.restore();
    }

    ctx.strokeStyle = palette.accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(block.x, screenY, block.width, block.height, 10);
    ctx.stroke();
  }
  else if (skinId === "icecream") {
    ctx.fillStyle = palette.body;
    ctx.beginPath();
    ctx.roundRect(block.x, screenY, block.width, block.height, 8);
    ctx.fill();

    ctx.fillStyle = palette.frosting;
    ctx.fillRect(block.x, screenY, block.width, 12);

    const dripCount = Math.floor(block.width / 18);
    for (let i = 0; i < dripCount; i++) {
      ctx.beginPath();
      ctx.ellipse(block.x + 9 + i * 18, screenY + 14, 7, 9, 0, 0, Math.PI);
      ctx.fill();
    }

    ctx.fillStyle = "#ffffff55";
    ctx.beginPath();
    ctx.ellipse(block.x + block.width * 0.3, screenY + 6, 12, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    if (block.decorType % 2 === 0) {
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(block.x + block.width / 2, screenY - 1, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#166534";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(block.x + block.width / 2, screenY - 6);
      ctx.quadraticCurveTo(block.x + block.width / 2 + 4, screenY - 14, block.x + block.width / 2 + 8, screenY - 10);
      ctx.stroke();
    }

    ctx.strokeStyle = palette.accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(block.x, screenY, block.width, block.height, 8);
    ctx.stroke();
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  drawBackground();

  for (let i = 0; i < blocks.length; i++) {
    drawCakeBlock(blocks[i], i);
  }

  if (currentBlock && !gameOver) {
    drawCakeBlock(currentBlock, blocks.length);
  }

  drawParticles();
}

let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

function updatePauseButton() {
  pauseButton.textContent = paused ? "▶" : "Ⅱ";
}

function togglePause() {
  if (!started || gameOver) return;
  paused = !paused;
  messageElement.textContent = paused ? "Jogo Pausado" : "Toque na tela para colocar a camada de bolo";
  updatePauseButton();
}

// Event Listeners
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  initAudio();
  if (gameOver) {
    returnToStartScreen();
    return;
  }
  placeBlock();
});

gameOverScreen.addEventListener("pointerdown", e => {
  e.preventDefault();
  returnToStartScreen();
});

playButton.addEventListener("click", e => {
  e.stopPropagation();
  startGame();
});

skinsButton.addEventListener("click", e => {
  e.stopPropagation();
  renderSkinsModal();
  skinsModal.classList.remove("hidden");
});

closeSkinsModal.addEventListener("click", () => {
  skinsModal.classList.add("hidden");
});

easyButton.addEventListener("click", () => selectDifficulty("easy", 0.5));
normalButton.addEventListener("click", () => selectDifficulty("normal", 1.0));
hardButton.addEventListener("click", () => selectDifficulty("hard", 1.5));
impossibleButton.addEventListener("click", () => selectDifficulty("impossible", 2.0));

pauseButton.addEventListener("click", e => {
  e.stopPropagation();
  togglePause();
  pauseButton.blur();
});

resetButton.addEventListener("click", e => {
  e.stopPropagation();
  if (started && !gameOver && confirm("Deseja reiniciar a partida atual?")) {
    returnToStartScreen();
  }
  resetButton.blur();
});

document.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Space" || e.key === " ") {
    e.preventDefault();
    placeBlock();
  } else if (e.code === "Enter" || e.key === "Enter") {
    e.preventDefault();
    if (gameOver) returnToStartScreen();
    else togglePause();
  }
});

// Initial Setup
selectDifficulty("normal", 1.0);
coinsElement.textContent = formatCoins(coins);
pauseButton.style.display = "none";
resetButton.style.display = "none";
gameOverScreen.style.display = "none";

resize();
requestAnimationFrame(gameLoop);
</script>
</body>
